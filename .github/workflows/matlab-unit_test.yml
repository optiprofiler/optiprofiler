name: MATLAB full unit regression

on:
  push:
    branches: [main, matlab]
  workflow_dispatch:

jobs:
  run:
    name: Generate coverage report for MATLAB ${{ matrix.matlab }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        matlab: [latest]
        with_optim_toolbox: [yes]

    steps:

      - name: Check out requested revision with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate MATLAB problem-library lock
        run: python3 tools/check_matlab_problem_libraries_lock.py

      - name: Install PDF regression test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdfunite -v
          pdftotext -v

      - name: Use system libraries for PDF test tools
        run: |
          # MATLAB's bundled libstdc++ may be older than Ubuntu's Poppler.
          # Only these system-tool children use a clean loader path; MATLAB
          # itself and its solver/MEX dependencies keep their environment.
          tool_bin="$RUNNER_TEMP/op-pdf-test-bin"
          mkdir -p "$tool_bin"
          for tool in pdfunite pdftotext; do
            printf '#!/bin/sh\nexec /usr/bin/env -u LD_LIBRARY_PATH /usr/bin/%s "$@"\n' "$tool" > "$tool_bin/$tool"
            chmod +x "$tool_bin/$tool"
          done
          echo "$tool_bin" >> "$GITHUB_PATH"

      - name: Cache MATLAB  # N.B.: Clear the cache when the `latest` version of MATLAB changes in March and September
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/MATLAB
          key: ${{ matrix.os }}-${{ matrix.matlab }}

      - name: Set up MATLAB with optimization toolbox
        if: ${{ matrix.with_optim_toolbox == 'yes' }}
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.matlab }}
          products: Optimization_Toolbox Parallel_Computing_Toolbox

      - name: Setup OptiProfiler and run tests
        uses: matlab-actions/run-command@v2.1.1
        with:
          command: |
            addpath(fullfile(pwd, 'tools'));
            run_matlab_full_unit_ci(pwd, fullfile(getenv('RUNNER_TEMP'), 'matlab-full-unit'));

      - name: Upload full-unit results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-full-unit-${{ github.sha }}
          path: ${{ runner.temp }}/matlab-full-unit/
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v1
        with:
          file: ${{ runner.temp }}/matlab-full-unit/coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
