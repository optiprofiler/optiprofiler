# Python unit test with code coverage

name: Python unit test

on:
  push:
    branches: [main, python]
  pull_request:
    branches: [main, python]
  workflow_dispatch:

jobs:
  run:
    name: Generate coverage report for Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout bundled S2MPJ
        run: git submodule update --init --depth 1 python/optiprofiler/problem_libs/s2mpj

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # These fixture-based checks need only Python and Git, not Sphinx or
      # numerical dependencies. One matrix job is sufficient for docs config.
      - name: Check documentation source links
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        run: python -m unittest discover -s doc/tests -v

      - name: Generate coverage reports
        run: bash .github/actions/test-python/run-tests.sh

      - name: Upload coverage reports
        if: ${{ github.event_name != 'pull_request' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  minimum_dependencies:
    name: Declared dependency floors on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout bundled S2MPJ
        run: git submodule update --init --depth 1 python/optiprofiler/problem_libs/s2mpj

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the wheel
        run: |
          python -m pip install --progress-bar=off build uv
          python -m build --wheel --outdir wheel-dist

      - name: Install the declared floors and exercise them
        run: >-
          python tools/check_minimum_dependencies.py
          --wheel wheel-dist/*.whl
          --python ${{ matrix.python-version }}
          --output-dir "$RUNNER_TEMP/minimum-dependencies"

      - name: Retain the receipts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimum-dependencies-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/minimum-dependencies/receipt.json
            ${{ runner.temp }}/minimum-dependencies/*/smoke/
