# Python test multi-OS: Test all 11 features on multiple OS and Python versions

name: Python test multi-OS

on:
  push:
    branches: [main, python, paper/v1.3.4-errata]
  pull_request:
    branches: [main, python, paper/v1.3.4-errata]
  workflow_dispatch:

jobs:

  test:
    name: Python ${{ matrix.python-version }} on ${{ (matrix.os == 'ubuntu-latest' && (matrix.python-version == '3.8' || matrix.python-version == '3.9')) && 'ubuntu-24.04' || matrix.os }}
    # Ubuntu 26.04 (ubuntu-latest since 2026-11) provides no Python 3.8 or 3.9.
    runs-on: ${{ (matrix.os == 'ubuntu-latest' && (matrix.python-version == '3.8' || matrix.python-version == '3.9')) && 'ubuntu-24.04' || matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CUTEst on Linux
        if: ${{ runner.os == 'Linux' }}
        run: bash .github/actions/test-python/install-cutest.sh

      - name: Install package
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            export PYCUTEST_CACHE=$GITHUB_WORKSPACE
            python -m pip install --progress-bar=off ".[extra,tests]"
          else
            python -m pip install --progress-bar=off ".[tests]"
          fi
        shell: bash

      - name: Create output directory
        run: mkdir -p output
        shell: bash

      - name: Run all feature tests
        run: |
          cd output
          python ../python/optiprofiler/action_tests/test_all_features.py "os_${{ runner.os }}_py${{ matrix.python-version }}"
        env:
          S2MPJ_VARIABLE_SIZE: all
          S2MPJ_TEST_FEASIBILITY_PROBLEMS: 2
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: out_${{ matrix.os }}_py${{ matrix.python-version }}
          path: output/
