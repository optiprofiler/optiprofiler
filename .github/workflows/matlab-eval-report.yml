# Targeted EvalReport (report_path) coverage on every supported OS. Intended
# coverage (verified only by each row's own receipt, never assumed):
# - R2021b rows: every serial contract case; the real-worker case is omitted
#   because hosted runners license MATLAB through matlab-batch and
#   batch-licensed parallel pools are unsupported before R2023a (MathWorks;
#   reproduced by the parpool probe workflow). The omission is named in the
#   job title and in receipt.json and is scoped to this partition.
# - R2023a rows and latest rows: the full TestEvalReport class with real
#   Parallel Computing Toolbox workers. Every row gates on Failed=0 AND
#   Incomplete=0 with the exact expected case set, so a filtered or missing
#   case cannot pass silently. The supported product floor stays R2021b.

name: MATLAB EvalReport platforms

on:
  push:
    # workflow_dispatch can only target workflows that already exist on the
    # default branch, so acceptance runs of this new workflow are triggered by
    # pushes to the candidate branch; that entry can be dropped at integration.
    branches: [main, matlab, codex/eval-report]
    # Probe-only and documentation-only pushes do not need the full matrix.
    paths-ignore: ['.github/workflows/matlab-parpool-probe.yml', 'doc/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-report:
    name: EvalReport on MATLAB ${{ matrix.matlab }} / ${{ matrix.os }} (${{ matrix.parallel_case }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        matlab: [R2021b, R2023a, latest]
        include:
          - {matlab: R2021b, parallel_case: parallel-omitted-batch-licensing}
          - {matlab: R2023a, parallel_case: real-workers}
          - {matlab: latest, parallel_case: real-workers}
    env:
      # Isolate every persistent side channel: registry, path persistence and
      # preferences live under the workspace, never in the runner's MATLAB.
      OPTIPROFILER_MATLAB_PROBLEM_LIBRARY_REGISTRY: ${{ github.workspace }}/ci-state/problem_libraries.mat
      OPTIPROFILER_MATLAB_PROBLEM_LIBRARY_PATHDEF: ${{ github.workspace }}/ci-state/pathdef.m
      OPTIPROFILER_MATLAB_PROBLEM_LIBRARY_STARTUP: ${{ github.workspace }}/ci-state/startup.m
      MATLAB_PREFDIR: ${{ github.workspace }}/ci-state/matlab-prefdir
      # Marks the hosted, batch-licensed environment for which the serial
      # partition is approved; the runner refuses the omission without it.
      OPTIPROFILER_CI_HOSTED_BATCH_LICENSING: '1'

    steps:
      - name: Check out requested revision with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create isolated MATLAB state directories
        shell: bash
        run: mkdir -p ci-state/matlab-prefdir ci-output

      # The summary-PDF merge needs an external backend on the latest-release
      # runners: R2026a bundles no Apache PDFBox (R2024b and R2025a bundle
      # PDFBox 2.0.24). Without one the report truthfully records a partial
      # rendering stage; with one the merged summary becomes a verified
      # artifact. Same tools as the full-unit workflow, with the clean loader
      # path for Ubuntu's Poppler.
      - name: Install a PDF merge backend (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          tool_bin="$RUNNER_TEMP/op-pdf-test-bin"
          mkdir -p "$tool_bin"
          for tool in pdfunite pdftotext; do
            printf '#!/bin/sh\nexec /usr/bin/env -u LD_LIBRARY_PATH /usr/bin/%s "$@"\n' "$tool" > "$tool_bin/$tool"
            chmod +x "$tool_bin/$tool"
          done
          echo "$tool_bin" >> "$GITHUB_PATH"
          pdfunite -v

      - name: Install a PDF merge backend (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install poppler
          pdfunite -v

      - name: Install a PDF merge backend (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: choco install poppler -y --no-progress

      - name: Set up MATLAB with parallel computing toolbox
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.matlab }}
          cache: true
          products: Parallel_Computing_Toolbox

      - name: Run TestEvalReport with an Incomplete=0 gate
        uses: matlab-actions/run-command@v2.1.1
        with:
          command: |
            addpath(fullfile(pwd, 'tools'));
            run_matlab_eval_report_ci(pwd, fullfile(pwd, 'ci-output'), '${{ matrix.parallel_case }}');

      - name: Upload EvalReport results and sample reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ matrix.os }}-${{ matrix.matlab }}-${{ github.sha }}
          path: ci-output/
          if-no-files-found: error
