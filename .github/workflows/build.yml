# Build, test, and publish the package

name: build

on:
  push:
    branches: [main, python]
    tags:
      - 'v*'
  pull_request:
    branches: [main, python]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_package:
    name: Build source and binary distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout bundled S2MPJ
        run: git submodule update --init --depth 1 python/optiprofiler/problem_libs/s2mpj

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Test release validation and reject mismatched tags
        shell: bash
        run: |
          python -m unittest discover -s tools/tests -v
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python tools/check_release.py --tag "$GITHUB_REF_NAME"
          else
            python tools/check_release.py
          fi

      - name: Build source and binary distributions
        run: bash .github/actions/build/build_package.sh

      - name: Verify built versions and required resources
        shell: bash
        run: |
          args=(--dist-dir dist --manifest dist/release-manifest.json)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          python tools/check_release.py "${args[@]}"

      - name: Test source and binary distributions
        run: bash .github/actions/build/test_package.sh

      - name: Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*

  installed_artifacts:
    name: Installed ${{ matrix.artifact }} on ${{ matrix.os }}
    needs: build_package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        artifact: [wheel, sdist]
    env:
      MPLBACKEND: Agg
      PYTHONPATH: ''
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout acceptance tools only
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the exact built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist

      - name: Install through ordinary dependency resolution
        shell: bash
        env:
          ARTIFACT_KIND: ${{ matrix.artifact }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys
          suffix = '*.whl' if os.environ['ARTIFACT_KIND'] == 'wheel' else '*.tar.gz'
          files = list(pathlib.Path('dist').glob(suffix))
          assert len(files) == 1, files
          subprocess.run([sys.executable, '-m', 'pip', 'install', str(files[0]) + '[tests]'], check=True)
          PY
          python -m pip check

      - name: Exercise installed public APIs outside the checkout
        shell: bash
        run: |
          version=$(python -c "import json; print(json.load(open('dist/release-manifest.json'))['version'])")
          python tools/smoke_python_distribution.py --source-root "$GITHUB_WORKSPACE" --expected-version "$version" --output-dir "$RUNNER_TEMP/installed-acceptance"

      - name: Retain runtime receipts and figures even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-${{ matrix.artifact }}-${{ matrix.os }}
          path: ${{ runner.temp }}/installed-acceptance/

  upload_anaconda:
    name: Upload to Anaconda
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build_package, installed_artifacts]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist

      - name: Upload artifacts to Anaconda
        run: bash .github/actions/build/upload_anaconda.sh
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}

  upload_pypi:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build_package, installed_artifacts]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist

      # The acceptance manifest is retained in the build artifact, but is not
      # a Python distribution and must never be passed to Twine.
      - name: Select distribution files for upload
        shell: bash
        run: |
          mkdir upload
          cp dist/*.whl dist/*.tar.gz upload/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: upload/
          skip-existing: false
