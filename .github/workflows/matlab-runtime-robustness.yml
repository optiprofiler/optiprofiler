name: MATLAB runtime robustness (exact SHA)

on:
  push:
    branches: [main, python, matlab, paper/v1.3.4-errata]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Latest MATLAB on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out the triggering commit and its locked submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      # Runner-dependent paths are available in steps, not in job-level env.
      - name: Prepare isolated output and MATLAB preferences
        shell: pwsh
        run: |
          $prefDir = Join-Path $env:RUNNER_TEMP 'op-runtime-prefs'
          $evidenceDir = Join-Path $env:RUNNER_TEMP 'op-runtime-evidence'
          New-Item -ItemType Directory -Force -Path $prefDir,$evidenceDir | Out-Null
          "MATLAB_PREFDIR=$prefDir" >> $env:GITHUB_ENV
          "OP_RUNTIME_EVIDENCE=$evidenceDir" >> $env:GITHUB_ENV

      # Synthetic history reloads and bundled S2MPJ/setup; no optimizer or pool runs.
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          cache: true

      - name: Run mandatory platform-specific regression cases
        uses: matlab-actions/run-command@v2.1.1
        with:
          command: |
            addpath('tools');
            run_matlab_runtime_robustness(pwd, getenv('OP_RUNTIME_EVIDENCE'));

      - name: Upload exact-SHA results, including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-runtime-${{ matrix.os }}-${{ github.sha }}
          path: ${{ env.OP_RUNTIME_EVIDENCE }}
          if-no-files-found: warn
